services:
  - type: web
    name: task-manager
    runtime: node
    plan: free
    buildCommand: npm ci && npx knex migrate:latest && npx knex seed:run
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_SSL
        value: "true"
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: task-manager-db
          property: connectionString

databases:
  - name: task-manager-db
    plan: free
    databaseName: taskman
